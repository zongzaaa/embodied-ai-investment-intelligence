 [c.savings>0?'Customer savings support a testable adoption case':'Customer economics fail to support adoption',`${num(c.productive,0)} productive hours; ${num(c.savings,0)} USD annual savings; payback ${c.payback===null?'not reached':num(c.payback,1)+' years'}. All scenario estimates.`],
 [best.npv>0?'Entry terms leave room above the hurdle':'Valuation leaves inadequate return headroom',`${label(best.key)} produces ${money(best.npv)} mandate NPV at a ${A.hurdle}% hurdle. Proceeds depend on revenue, exit margins, ownership and survival.`],
 [d.g.scale?'Scale evidence permits aggressive entry':'Reliability still limits capital release',`${d.g.pilot?'Pilot gate passed':'Pilot gate failed'}; ${d.g.scale?'scale gate passed':'scale gate failed'}. ${money(m.results[2].undeployed)} of staged budget remains undeployed before cash interest.`]
 ].map(([t,p],i)=>`<div class="thesis"><span class="number">0${i+1}</span><div><h4>${t}</h4><p>${p}</p></div></div>`).join(''));
 put('allocationChart',allocation(r));put('bucketTable',`<table><thead><tr><th>Exposure</th><th>Defensibility / maturity</th><th class="num">Expected proceeds</th></tr></thead><tbody>${A.buckets.map((b,i)=>`<tr><td><strong>${esc(b.short)}</strong><br>${esc(b.intensity)}<br>${esc(b.liquidity)}</td><td>${esc(b.defensibility)}<br><span class="muted">${esc(b.maturity)}; risk: ${esc(b.risk)}</span></td><td class="num">${money(r.bucketContributions[i])}</td></tr>`).join('')}</tbody></table><p class="table-note">Expected equity proceeds exclude reserved cash. Bucket-level outputs are derived from synthetic investees, not observed fund returns.</p>`);
 put('cashflows',`<div class="table-wrap"><table><thead><tr><th>Date / event</th><th class="num">Net cash flow</th></tr></thead><tbody>${r.flows.map(f=>`<tr><td>${f.date} · ${esc(f.label)}</td><td class="num">${money(f.amount)}</td></tr>`).join('')}</tbody></table></div><div class="stats-row"><div><strong>${num(r.states[1].grossMoic,2)}×</strong><span>Base invested gross MOIC</span></div><div><strong>${num(r.states[1].netMoic,2)}×</strong><span>Base invested net MOIC</span></div><div><strong>${money(r.expectedProfit)}</strong><span>Expected mandate P/L</span></div></div><p class="table-note">Deal IRR ${pct(r.expectedDealIrr)} uses actual calls above; mandate IRR ${pct(r.mandateIrr)} charges the entire budget on 12 Oct 2026 and includes terminal reserve. Total undeployed principal ${money(r.undeployed)}; terminal reserve ${money(r.reserve)}.</p>`);
 const maxcall=Math.max(1,...r.states[0].calls.map(x=>-x.amount));put('timeline',`<div class="timeline" role="img" aria-label="Capital deployment timeline">${Array.from({length:11},(_,i)=>{let y=2026+i,v=r.states[0].calls.filter(c=>c.date===date(y)).reduce((s,x)=>s-x.amount,0);return `<div class="tick"><div class="column" style="height:${v/maxcall*64}px" title="${y}: ${money(v)} capital call">${v?`<span>${money(v)}</span>`:''}</div><div style="margin-top:7px">${y}</div></div>`;}).join('')}</div>`);
 put('equityBridge',`<div class="table-wrap" style="margin-top:20px"><table><thead><tr><th>Base case proxy</th><th class="num">Revenue</th><th class="num">EV</th><th class="num">Equity</th><th class="num">Stake</th></tr></thead><tbody>${r.states[1].buckets.map(b=>`<tr><td>${esc(b.name)}</td><td class="num">${money(b.revenue)}</td><td class="num">${money(b.enterprise)}</td><td class="num">${money(b.equity)}</td><td class="num">${pct(b.ownership)}</td></tr>`).join('')}</tbody></table></div><p class="table-note">Equity = max(EV − net debt, 0). Stakes incorporate follow-on share issuance and assumed external dilution. Survival probability weights exit proceeds; no interim dividends or tax/carry model.</p>`);
 put('customerResults',`<div class="stats-row"><div><strong>$${num(c.costHour,2)}</strong><span>Per productive hour</span></div><div><strong>$${num(c.costTask,3)}</strong><span>Per accepted task</span></div><div><strong>${c.payback===null?'N/A':num(c.payback,1)+'y'}</strong><span>Simple payback</span></div></div><table><tbody>${[['Upfront acquisition + integration','$'+num(c.upfront,0)],['Annual operating cost incl. supervision','$'+num(c.operating,0)],['Annual equivalent labour avoided','$'+num(c.avoided,0)],['Annual customer savings','$'+num(c.savings,0)],['Annual unlevered cash ROI',pct(c.roi)],['Annual accepted productive hours',num(c.productive,0)]].map(([l,v])=>`<tr><td>${l}</td><td class="num">${v}</td></tr>`).join('')}</tbody></table><p class="table-note">Productive hours = scheduled hours × uptime × accepted effectiveness. Operating cost includes supervision on all scheduled hours. Productive-hour cost adds straight-line capital recovery over useful life. Cash ROI = annual savings / upfront outlay, before depreciation/tax. No throughput benefit is counted twice.</p>`);
 put('strategyCards',m.results.map(x=>strategyCard(x,d)).join(''));let gs=[['Mandatory safeguards',d.g.hard,'Safety, reuse rights, financing, differentiated IP, no unacceptable platform capture; positive savings.'],['Pilot tranche',d.g.pilot,'Payback ≤3 years; uptime ≥90%; effectiveness ≥85%; interventions ≤30 / 1,000.'],['Scale tranche / immediate entry',d.g.scale,'≥3 sites; uptime ≥97%; effectiveness ≥97%; interventions ≤5 / 1,000; portable workflow.'],['Verified-evidence requirement',A.mode==='demo'||A.gates.evidence,A.mode==='demo'?'Bypassed only in visibly labelled research demonstration mode.':'Requires independent deal financials and deployment evidence.']];put('gateResults',gs.map(([t,pass,s])=>`<div class="gate-row"><div><strong>${t}</strong><small>${s}</small></div><span class="${pass?'pass':'fail'}">${pass?'PASS':'FAIL / UNRESOLVED'}</span></div>`).join('')+`<div class="callout"><strong>Why this recommendation?</strong><br>${esc(d.reason)} ${d.key?`The selected candidate clears ${A.hurdle}% hurdle NPV and the ${A.maxLoss}% scenario-loss ceiling.`:''}<br>Key risk: modelled scenario outcomes are uncalibrated and private exits are uncertain.<br>What changes the decision: entry valuation, independently demonstrated gates, customer savings or downside tolerance.</div><p class="table-note">Policy: reject failed hard gates; require positive mandate NPV and downside within the ceiling; rank eligible strategies by NPV. Immediate entry additionally requires scale evidence; staged entry requires pilot evidence. No hidden score.</p>`);
 r.states.forEach((s,i)=>put('stateResult'+i,`Terminal ${money(s.terminal)} · ${num(s.moic,2)}× mandate MOIC<br>Deal IRR ${pct(s.dealIrr)} · net invested MOIC ${num(s.netMoic,2)}×<br>${s.dealIrr===null?'No finite conventional IRR exists for this cash-flow path.':''}`));
 const factors=[.6,.8,1,1.2,1.4];let heat='<div class="heat-head">Entry ↓<br>Exit →</div>'+factors.map(v=>`<div class="heat-head">${v}×</div>`).join('');for(const en of factors){heat+=`<div class="heat-head">${en}×</div>`;for(const ex of factors){let a=clone(A);a.entryScale*=en;a.scenarios.forEach(s=>s.multiple*=ex);let mm=model(a);let v=mm.errors.length?null:mm.selected.expectedMoic;heat+=`<div class="heat-cell" style="background:${v===null?'#eee':v>=3?'#c1dfdf':v>=1?'#e3eef3':'#f6e4e0'}" title="Entry ${en}×, exit multiple ${ex}×: mandate MOIC ${num(v,2)}×">${num(v,2)}×</div>`;}}put('heatmap',`<div class="heatmap" role="img" aria-label="Valuation sensitivity matrix">${heat}</div>`);
 const stresses=[['Entry price',a=>a.entryScale*=.8,a=>a.entryScale*=1.2],['Revenue growth',a=>a.scenarios.forEach(s=>s.growth*=.8),a=>a.scenarios.forEach(s=>s.growth*=1.2)],['Exit multiple',a=>a.scenarios.forEach(s=>s.multiple*=.8),a=>a.scenarios.forEach(s=>s.multiple*=1.2)],['Survival',a=>a.scenarios.forEach(s=>s.success*=.8),a=>a.scenarios.forEach(s=>s.success=Math.min(100,s.success*1.2))],['Later entry prices',a=>a.entryGrowth*=.8,a=>a.entryGrowth*=1.2]];let stress=stresses.map(([n,lo,hi])=>{let a=clone(A),b=clone(A);lo(a);hi(b);let x=model(a),y=model(b);return[n,x.errors.length?null:x.selected.expectedTerminal,y.errors.length?null:y.selected.expectedTerminal];});put('tornado',`<table><thead><tr><th>Driver</th><th class="num">−20% input</th><th class="num">+20% input</th></tr></thead><tbody>${stress.map(([n,l,h])=>`<tr><td>${n}</td><td class="num">${money(l)}</td><td class="num">${money(h)}</td></tr>`).join('')}</tbody></table><p class="table-note">Survival caps at 100%. Greater growth compounds over the horizon; strategy timing is compared in Section 04 and can also be edited directly. N/A indicates a stress outside allowed input limits.</p>`);
 put('sources',EVIDENCE.filter(x=>x.claimId.startsWith('E')).map(e=>`<div class="source-item"><span class="tag">${esc(e.classification)}</span><h3 style="font-size:12px">${esc(e.parameter)}</h3><p>${esc(e.notes)}</p><p>${esc(e.source)} · ${esc(e.publicationDate)} · accessed ${esc(e.accessDate)}</p>${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">Open original source ↗</a>`:''}</div>`).join(''));put('printInputs',esc(printAssumptions()));}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3500);}
function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast(`Generated ${name}`);}
function preset(k){A=clone(DEFAULTS);if(k==='now'){Object.assign(A.customer,{uptime:99,success:99,interventions:2,sites:4});A.gates.scale=true;A.maxLoss=100;A.entryScale=.6;}if(k==='wait'){A.entryGrowth=-15;A.maxLoss=100;A.waitRepricing=.75;}if(k==='no-go')A.customer.labour=5;if(k==='evidence')A.mode='verified';shell();}
document.addEventListener('input',e=>{const p=e.target.dataset.path;if(!p)return;const v=e.target.type==='checkbox'?e.target.checked:Number(e.target.value);set(p,v);document.querySelectorAll(`[data-path="${p}"]`).forEach(el=>{if(el!==e.target)el.value=e.target.value;});refresh();});
document.addEventListener('change',async e=>{if(e.target.id==='mode'){A.mode=e.target.value;refresh();}if(e.target.id==='importFile'&&e.target.files[0]){try{let v=JSON.parse(await e.target.files[0].text());const m=model(v);if(m.errors.length)throw Error(m.errors.join(' '));A=v;shell();toast('Imported and validated assumptions.');}catch(err){toast('Import rejected: '+err.message);}}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.evidence){showEvidence(b.dataset.evidence);return;}if(b.dataset.strategy){A.strategy=b.dataset.strategy;refresh();return;}if(b.dataset.preset){preset(b.dataset.preset);return;}switch(b.dataset.action){case'reset':A=clone(DEFAULTS);shell();toast('Baseline restored.');break;case'weights':A.weights=clone(DEFAULTS.weights);shell();break;case'save':try{localStorage.setItem('investment-intelligence-v1',JSON.stringify(A));toast('Scenario saved in this browser.');}catch{toast('Browser storage unavailable; export JSON instead.');}break;case'restore':try{let a=JSON.parse(localStorage.getItem('investment-intelligence-v1'));if(!a||model(a).errors.length)throw Error();A=a;shell();toast('Saved scenario restored.');}catch{toast('No valid saved scenario available.');}break;case'json':download('investment-scenario.json',JSON.stringify(A,null,2),'application/json');break;case'import':document.getElementById('importFile').click();break;case'csv':if(last.errors.length){toast('Correct invalid inputs before exporting cash flows.');break;}let rows=['strategy,scenario,date,event,amount_USD_m,flow_scope'];for(const r of last.results)for(const s of r.states){for(const f of s.dealFlows)rows.push([r.key,s.name,f.date,f.label,f.amount,'invested_capital'].map(x=>JSON.stringify(x)).join(','));for(const f of s.mandateFlows)rows.push([r.key,s.name,f.date,'mandate cash flow',f.amount,'committed_mandate'].map(x=>JSON.stringify(x)).join(','));}download('investment-cashflows.csv',rows.join('\n'),'text/csv');break;case'print':if(last.errors.length){toast('Correct invalid inputs before creating a snapshot.');break;}window.print();break;case'presentation':presentation=!presentation;document.body.classList.toggle('presentation',presentation);b.textContent=presentation?'Exit presentation':'Presentation';window.scrollTo(0,0);break;}});
function showEvidence(key){let e=EVIDENCE.find(x=>x.parameter===key);const definitions={expectedTerminal:'Sum over scenarios of probability × (ownership-adjusted equity proceeds + reserved cash). Includes a within-state commercial survival assumption.',expectedMoic:'Expected terminal mandate value / all committed capital. Includes undeployed principal and interest.',expectedDealIrr:'XIRR of dated investment outflows including fees and probability-weighted exit equity proceeds. This is IRR of the expected cash-flow path, not expected IRR.',downside:'Largest loss among the three modelled scenarios / committed budget. This is not maximum possible loss; a total loss remains possible.',deployed:'Actual investment principal released by the selected schedule. Entry costs are separate. Mandate less principal and costs remains cash.',recommendation:'Hard-gate checks, hurdle NPV, scenario-loss ceiling and highest eligible strategy NPV. Policy thresholds are assumptions, not empirical estimates.'};document.getElementById('evidenceContent').innerHTML=`<span class="tag">${esc(e?.classification||'Derived metric')}</span><h2>${esc(key)}</h2><p>${esc(e?.notes||definitions[key]||'Analyst input; not verified deal evidence.')}</p>${e?`<p><strong>Baseline:</strong> ${esc(e.value)} ${esc(e.units)}<br><strong>Current:</strong> ${esc(get(key)??'derived')}<br><strong>Source:</strong> ${esc(e.source)}<br><strong>Status:</strong> ${esc(e.status)} · ${esc(e.confidence)}</p>`:''}${e?.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">Open primary source</a>`:''}<p class="subtle">Model v1.0.0 · as of 12 Oct 2026. A financial default is not calibrated by the sector evidence unless explicitly stated.</p>`;document.getElementById('evidenceDialog').showModal();}
document.getElementById('closeEvidence').onclick=()=>document.getElementById('evidenceDialog').close();
window.InvestmentIntelligence={get:()=>clone(A),model:()=>model(A),set:a=>{let r=model(a);A=clone(a);shell();return r;},preset,reset:()=>preset('baseline')};shell();

function printAssumptions(){return [
'Model '+A.version+' | 12 Oct 2026 | '+A.mode+' mode. All financial defaults illustrative.',
'Mandate USD'+A.budget+'m; selected strategy '+label(A.strategy)+'; exit '+A.exitYear+'.',
'Weights '+A.weights.join('/')+'%; state probabilities '+A.probabilities.join('/')+'%.',
'Tranches initial '+A.initialPct+'%; pilot '+A.followPct+'% in '+A.followYear+'; remainder in '+A.scaleYear+'; wait entry '+A.waitYear+'.',
'Entry scale '+A.entryScale+'x; annual valuation change '+A.entryGrowth+'%; wait repricing '+A.waitRepricing+'x.',
'Reserve '+A.reserveRate+'%; entry costs '+A.feePct+'%; hurdle '+A.hurdle+'%; downside ceiling '+A.maxLoss+'%.',
'Customer '+JSON.stringify(A.customer),
'Gate attestations '+JSON.stringify(A.gates),
...A.scenarios.map((s,i)=>s.name+': probability '+A.probabilities[i]+'%; revenue growth '+s.growth+'%; adoption '+s.adoption+'%; margin '+s.margin+'%; EV/EBITDA '+s.multiple+'x; net debt USD'+s.debt+'m; dilution '+s.dilution+'%; survival '+s.success+'%; recovery '+s.recovery+'%.'),
...A.buckets.map(b=>b.short+': revenue USD'+b.revenue+'m; pre-money equity USD'+b.preMoney+'m; growth/margin/survival factors '+b.growthFactor+'/'+b.marginFactor+'/'+b.successFactor+'.'),
'Expected IRR is IRR of probability-weighted cash flows, not average scenario IRR. Private exit, survival and gates are assumptions. See local methodology and evidence registry.'
].join('\n\n');}
